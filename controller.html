
<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>PAUZ Controller</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;min-height:100dvh;background:#171322;display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:Arial;touch-action:none}.controller{width:min(92vw,160vh,760px);max-height:78dvh;aspect-ratio:2.05/1;position:relative;border-radius:15%/23%;background:linear-gradient(145deg,#77728a,#484459 32%,#302d42 70%,#242137);border:4px solid #88829e;box-shadow:0 8px 0 #171323,0 13px 0 #393449,inset 0 4px 8px #d3c9ef88,inset 0 -9px 15px #171322aa,0 0 25px #a68adf33}.shoulder{position:absolute;top:-2%;width:25%;height:13%;border-radius:40px;background:linear-gradient(#b0a9c5,#625d77 65%,#3c394e);border:3px solid #9690aa;box-shadow:0 5px 0 #201c30}.shoulder.left{left:11%}.shoulder.right{right:11%}.dpad{position:absolute;left:12%;top:35%;width:17%;height:36%}.dpad button{position:absolute;width:34%;height:34%;border-radius:9px;background:linear-gradient(145deg,#69647e,#383448);border:2px solid #918ba6;color:#eee8ff;font-size:clamp(14px,2.5vw,26px);box-shadow:0 5px 0 #191626}#up{left:33%;top:0}#down{left:33%;bottom:0}#square{left:0;top:33%}#right{right:0;top:33%}.center-pad{position:absolute;left:33%;top:34%;width:34%;height:36%;border-radius:12px;background:#262337;box-shadow:inset 0 4px 10px #151323;opacity:.55}.face-buttons{position:absolute;right:12%;top:29%;width:20%;height:43%}.face-buttons button{position:absolute;width:31%;height:37%;border-radius:50%;border:2px solid #aaa0c9;background:radial-gradient(circle at 35% 25%,#aa94e8,#66518e 75%);color:white;font-weight:bold;font-size:clamp(16px,2.5vw,27px);box-shadow:0 5px 0 #29243b,inset 0 2px 5px #ffffff66}#y{top:0;left:35%}#x{top:36%;left:0}#b{top:36%;right:0}#a{bottom:0;left:35%}.utility{position:absolute;bottom:8%;left:32%;width:36%;display:flex;justify-content:space-around}.utility button{width:clamp(46px,8vw,76px);aspect-ratio:1;border-radius:50%;border:5px double #aaa2bd;background:radial-gradient(circle,#716b85,#292638);color:#eee7ff;font-size:clamp(20px,3vw,30px);box-shadow:0 0 12px #bca8e044,inset 0 2px 6px #ffffff55}button{cursor:pointer;touch-action:none;user-select:none}.pressed,.dpad button:active,.face-buttons button:active{transform:translateY(3px);background:#b18ae9!important;box-shadow:0 2px 0 #29243b!important}#status{position:fixed;top:5px;left:0;right:0;color:#d9c7ff;text-align:center;font-size:12px;z-index:5}@media(orientation:portrait){body:after{content:'Please rotate your phone to landscape';position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#171322;color:#e2d4ff;font-size:20px}}@media(max-height:350px){.controller{width:min(88vw,750px)}}
</style></head><body>
<div id="status">Connecting to your game...</div><div class="controller"><div class="shoulder left"></div><div class="shoulder right"></div><div class="center-pad"></div>
<div class="dpad"><button id="up">△</button><button id="square" aria-label="Square">□</button><button id="right">○</button><button id="down">×</button></div>
<div class="face-buttons"><button id="y">Y</button><button id="x">X</button><button id="b">B</button><button id="a">A</button></div>
<div class="utility"><button id="book" aria-label="Controls guide">▤</button><button id="help" aria-label="How to play">?</button></div></div>
<script>
const session=new URLSearchParams(location.search).get('session'),statusText=document.getElementById('status'),protocol=location.protocol==='https:'?'wss:':'ws:';let ws;
if(!session)statusText.textContent='Invalid controller link';else{ws=new WebSocket(`${protocol}//${location.host}/?session=${encodeURIComponent(session)}&role=controller`);ws.onopen=()=>statusText.textContent='Connected! Ready to play.';ws.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==='status')statusText.textContent=d.connected?'Connected to laptop!':'Waiting for laptop game...'}catch(_){}};ws.onclose=()=>statusText.textContent='Disconnected. Refresh to reconnect.';ws.onerror=()=>statusText.textContent='Connection error.'}
function send(d){if(ws&&ws.readyState===1)ws.send(JSON.stringify(d))}
function action(id,button){let el=document.getElementById(id),down=false;function press(e){e.preventDefault();if(down)return;down=true;el.classList.add('pressed');send({type:'input',button,pressed:true})}function release(e){if(e)e.preventDefault();if(!down)return;down=false;el.classList.remove('pressed');send({type:'input',button,pressed:false})}el.addEventListener('pointerdown',e=>{try{el.setPointerCapture(e.pointerId)}catch(_){}press(e)});['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,release))}
action('b','B');action('square','SQUARE');
function panel(id,name){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.classList.add('pressed');send({type:'panel',panel:name})});['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,()=>el.classList.remove('pressed')))}
panel('book','controls');panel('help','help');
</script></body></html>
